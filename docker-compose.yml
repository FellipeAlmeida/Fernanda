services:

  db:
    container_name: database
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fernanda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: api
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - fernanda-network
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.server:app --host 0.0.0.0 --port ${PORT:-5000}
      "

  adminer:
    container_name: adminer
    image: adminer
    ports:
      - "8080:8080"
    networks:
      - fernanda-network

  frontend:
    container_name: front
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/src
      - /src/node_modules
    depends_on:
      - api
    networks:
      - fernanda-network

volumes:
  postgres_data:

networks:
  fernanda-network:
    external: true